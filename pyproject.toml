[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-mail-mcp"
version = "0.1.0"
description = "Local read-only IMAP MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2"]

[project.scripts]
private-mail-mcp = "private_mail_mcp.server:main"

[tool.setuptools.packages.find]
include = ["private_mail_mcp*"]
